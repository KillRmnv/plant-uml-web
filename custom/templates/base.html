<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="keywords" content="" />
        <meta name="description" content="" />
        <title>SC-Web Minimal</title>

        <link
            rel="stylesheet"
            type="text/css"
            href="/static/common/bootstrap/css/bootstrap.min.css"
        />
        <link
            rel="stylesheet"
            type="text/css"
            href="/static/common/bootstrap/css/bootstrap-multilevel.css"
        />
        <link
            rel="stylesheet"
            type="text/css"
            href="/static/components/css/common.css"
        />
        <link
            rel="stylesheet"
            type="text/css"
            href="/static/components/css/bootstrap-override.css"
        />
        <link
            rel="stylesheet"
            type="text/css"
            href="/static/components/css/scg.css"
        />
        <link
            rel="stylesheet"
            type="text/css"
            href="/static/components/css/scs.css"
        />

        {% include 'common.html' %} {% include 'components.html' %}
    </head>

    <body id="body">
        <script>
            var serverHost = "{{ public_url }}";
        </script>

        <!-- Минимальный контейнер - только поиск и окна -->
        <div id="main-container" class="main-container">
            <!-- Панель инструментов (поиск) -->
            <div id="window-header-tools" class="pull-right">
                <div id="search-panel" class="no_display">
                    <form role="search">
                        <div class="form-group">
                            <input
                                id="search-input"
                                type="text"
                                class="typeahead form-control"
                                sc_control_sys_idtf="ui_control_search_idtf_edit"
                                style="width: 250px"
                                data-provide="typeahead"
                                autocomplete="off"
                            />
                        </div>
                    </form>
                </div>
            </div>

            <!-- Контейнер окон -->
            <div
                id="window-container"
                class="col-xs-12 col-sm-12 col-md-12"
            ></div>
        </div>

        <!-- Locker (индикатор загрузки) -->
        <div id="sc-ui-locker">
            <div id="sc-ui-locker-text">Loading...</div>
            <div id="sc-ui-locker-icon"></div>
        </div>

        <div id="sctp-reconnection"></div>

        <!-- Подключаем кастомный main.js с отключенными компонентами -->
        <script
            type="text/javascript"
            charset="utf-8"
            src="/custom/js/main.js"
        ></script>

        <script type="text/javascript">
            $(document).ready(function () {
                SCWeb.ui.Locker.show();
                let params = {
                    menu_container_id: "menu_container",
                };
                $.when(SCWeb.core.Main.init(params)).done(function () {
                    SCWeb.ui.Locker.hide();
                    console.log("[Minimal] SCWeb инициализирован");
                });
            });
        </script>
    </body>
</html>
