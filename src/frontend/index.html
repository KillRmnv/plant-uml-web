<!DOCTYPE html>
<!--
    TODO: Добавить Bootstrap для стилизации UI
    TODO: Добавить панель инструментов (toolbar) для выбора режимов редактирования
    TODO: Добавить кнопки сохранения/загрузки графа
    TODO: Добавить модальные окна для настройек
-->
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCg Editor</title>
    
    <!-- Bootstrap CSS (TODO: раскомментировать после добавления в проект) -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    
    <!-- jQuery - требуется для SCg -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- D3.js - требуется для рендеринга SVG -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <!-- SCg стили - требуется для редактора -->
    <link rel="stylesheet" href="/static/components/css/scg.css">
    
    <!-- Стили проекта (TODO: создать custom.css) -->
    <!-- <link rel="stylesheet" href="/static/css/custom.css"> -->
</head>
<body>
    <!--
        TODO: Добавить navbar с:
        - Кнопками выбора режима (выделение, создание узла, создание дуги, создание контура)
        - Кнопками отмены/повтора действий (undo/redo)
        - Кнопками масштабирования
        - Кнопками сохранения/загрузки
    -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">SCg Editor</span>
            <div class="d-flex">
                <button id="btn-save" class="btn btn-outline-light me-2">Сохранить</button>
                <button id="btn-load" class="btn btn-outline-light">Загрузить</button>
            </div>
        </div>
    </nav>

    <!-- Основной контейнер редактора -->
    <!-- TODO: Добавить боковую панель с инструментами -->
    <div class="container-fluid">
        <div class="row">
            <!-- Панель инструментов (TODO: реализовать) -->
            <div class="col-md-2 bg-light p-2">
                <h5>Инструменты</h5>
                <div class="btn-group-vertical w-100" role="group">
                    <button type="button" class="btn btn-secondary active" data-mode="select">Выделение</button>
                    <button type="button" class="btn btn-secondary" data-mode="node">Узел</button>
                    <button type="button" class="btn btn-secondary" data-mode="connector">Связь</button>
                    <button type="button" class="btn btn-secondary" data-mode="contour">Контур</button>
                    <button type="button" class="btn btn-secondary" data-mode="bus">Шина</button>
                    <button type="button" class="btn btn-secondary" data-mode="link">Ссылка</button>
                </div>
                
                <h5 class="mt-3">Типы узлов</h5>
                <!-- TODO: Добавить выбор типа узла (константа, переменная, мета, etc.) -->
                <select id="node-type" class="form-select">
                    <option value="const">Константа</option>
                    <option value="var">Переменная</option>
                </select>
                
                <h5 class="mt-3">Масштаб</h5>
                <div class="d-flex">
                    <button id="btn-zoom-in" class="btn btn-sm btn-outline-secondary">+</button>
                    <span id="zoom-level" class="mx-2">100%</span>
                    <button id="btn-zoom-out" class="btn btn-sm btn-outline-secondary">-</button>
                </div>
            </div>
            
            <!-- Область редактора -->
            <div class="col-md-10">
                <div id="scg-container" style="width: 100%; height: 600px; border: 1px solid #ddd;"></div>
            </div>
        </div>
    </div>

    <!--
        TODO: Добавить модальные окна:
        - Модальное окно изменения идентификатора узла
        - Модальное окно изменения типа узла/дуги
        - Модальное окно настроек подключения к sc-machine
    -->
    
    <!-- Модальное окно - Пример (TODO: реализовать) -->
    <div class="modal fade" id="settingsModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Настройки подключения</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">URL sc-machine</label>
                        <input type="text" class="form-control" id="sc-server-url" value="ws://localhost:8090/ws_json">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="btn-save-settings">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery - должен быть загружен до SCg -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- D3.js - должен быть загружен до SCg -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <!-- Bootstrap JS (TODO: раскомментировать) -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> -->
    
    <!-- SCg Editor - скомпилированный из external/sc-web -->
    <script src="/static/components/js/scg/scg.js"></script>
    
    <!-- Инициализация редактора -->
    <script src="/static/scg-init.js"></script>
    
    <!-- Основной скрипт приложения (TODO: создать) -->
    <!-- <script src="/static/js/app.js"></script> -->
</body>
</html>
