<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantUML Web - Login</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <!-- Login Form -->
        <div class="auth-card" id="login-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h1 class="auth-title">PlantUML Web</h1>
                <p class="auth-subtitle">Sign in to your account</p>
            </div>

            <form class="auth-form" id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-username">Username</label>
                    <input
                        type="text"
                        id="login-username"
                        class="form-input"
                        placeholder="Enter your username"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="login-password"
                            class="form-input"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="password-toggle" title="Show password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="remember-me" class="checkbox-input">
                        <span class="checkbox-label">Remember me</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="login-submit">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loading hidden">
                        <span class="spinner"></span>
                    </span>
                </button>

                <div class="auth-message hidden" id="login-message"></div>
            </form>

            <div class="auth-footer">
                <p>Don't have an account?
                    <a href="#" class="auth-link" id="show-register">Sign up</a>
                </p>
                <p class="auth-guest">
                    Or <a href="#" id="guest-login">continue as guest</a>
                </p>
            </div>
        </div>

        <!-- Register Form -->
        <div class="auth-card hidden" id="register-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Register a new account</p>
            </div>

            <form class="auth-form" id="register-form">
                <div class="form-group">
                    <label class="form-label" for="register-username">Username</label>
                    <input
                        type="text"
                        id="register-username"
                        class="form-input"
                        placeholder="Choose a username"
                        required
                        autocomplete="username"
                        minlength="3"
                        maxlength="32"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="register-email">Email (optional)</label>
                    <input
                        type="email"
                        id="register-email"
                        class="form-input"
                        placeholder="your@email.com"
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="register-password">Password</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="register-password"
                            class="form-input"
                            placeholder="Choose a password"
                            required
                            autocomplete="new-password"
                            minlength="6"
                        >
                        <button type="button" class="password-toggle" title="Show password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar"></div>
                        <span class="strength-text"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="register-confirm">Confirm Password</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="register-confirm"
                            class="form-input"
                            placeholder="Confirm your password"
                            required
                            autocomplete="new-password"
                        >
                        <button type="button" class="password-toggle" title="Show password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="form-hint" id="password-match-hint"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="register-submit">
                    <span class="btn-text">Create Account</span>
                    <span class="btn-loading hidden">
                        <span class="spinner"></span>
                    </span>
                </button>

                <div class="auth-message hidden" id="register-message"></div>
            </form>

            <div class="auth-footer">
                <p>Already have an account?
                    <a href="#" class="auth-link" id="show-login">Sign in</a>
                </p>
            </div>
        </div>

        <!-- Loading State -->
        <div class="auth-card hidden" id="loading-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h1 class="auth-title">PlantUML Web</h1>
            </div>
            <div class="auth-loading">
                <div class="spinner spinner-large"></div>
                <p class="loading-text">Loading...</p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api/client.js"></script>
    <script src="js/auth/auth-manager.js"></script>
    <script src="js/auth/auth-page.js"></script>
</body>
</html>
