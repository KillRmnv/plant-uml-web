[pytest]
# Корневая конфигурация pytest для plant-uml-web

minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Подключение src/ к PYTHONPATH чтобы import backend.* работал
pythonpath = src

# Асинхронные тесты — режим auto (без необходимости явного маркера)
asyncio_mode = auto

# Показывать print в выводе тестов
addopts =
    -ra
    -q
    --strict-markers
    --tb=short
    --color=yes

markers =
    unit: модульные тесты (без БД и сети)
    integration: интеграционные тесты (с in-memory БД)
    slow: медленные тесты
    sc_machine: требуют запущенный sc-machine (по умолчанию пропускаются)

filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:jose.*
