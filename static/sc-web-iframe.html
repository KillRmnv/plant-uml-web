<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Скрыть sidebar и footer */
        #static-window-container,
        #footer,
        .navbar-fixed-bottom,
        #history-container {
            display: none !important;
        }
        
        /* Контент на весь iframe */
        #main-container {
            position: absolute !important;
            top: 50px !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100% !important;
            height: calc(100% - 50px) !important;
            margin: 0 !important;
        }
        
        #window-container {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
    <iframe src="http://localhost:8000"></iframe>
</body>
</html>
