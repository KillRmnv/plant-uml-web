    <!-- SC-Client for connecting to sc-server -->
    <script src="js/sc-client/sc.js"></script>
    <script>
        // Initialize sc-client for connection to sc-server
        (function() {
            var SC_SERVER_URL = "ws://localhost:8090/ws_json";
            
            // Wait for sc namespace to be available
            function initScClient() {
                if (typeof sc === 'undefined' || typeof sc.ScClient === 'undefined') {
                    console.warn('[SC-Client] sc namespace not ready, retrying...');
                    setTimeout(initScClient, 100);
                    return;
                }
                
                try {
                    window.scClient = new sc.ScClient(SC_SERVER_URL);
                    console.log('[SC-Client] Connected to:', SC_SERVER_URL);
                    
                    // Initialize scHelper and scKeynodes
                    window.scHelper = new ScHelper(window.scClient);
                    window.scKeynodes = new ScKeynodes(window.scHelper);
                    
                    // Initialize scKeynodes (resolves keynodes)
                    window.scKeynodes.init().then(function() {
                        console.log('[SC-Keynodes] Initialized');
                        
                        // Initialize scHelper
                        window.scHelper.init().then(function() {
                            console.log('[SC-Helper] Initialized');
                            
                            // Dispatch event when everything is ready
                            window.dispatchEvent(new Event('scClientReady'));
                        }).catch(function(err) {
                            console.error('[SC-Helper] Init error:', err);
                        });
                    }).catch(function(err) {
                        console.error('[SC-Keynodes] Init error:', err);
                        // Try to continue anyway
                        window.dispatchEvent(new Event('scClientReady'));
                    });
                    
                } catch (error) {
                    console.error('[SC-Client] Failed to initialize:', error);
                }
            }
            
            // Initialize when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initScClient);
            } else {
                initScClient();
            }
        })();
    </script>
    
    <script>
        // Expose sc_type constants to global scope for SCg scripts
        (function() {
            if (typeof window.sc !== 'undefined') {
                Object.keys(window.sc).forEach(function(key) {
                    if (key.startsWith('sc_type_') || key.startsWith('sc_')) {
                        window[key] = window.sc[key];
                    }
                });
            }
        })();
    </script>

    <!-- Initialize SCWeb UI after scClient is ready -->
    <script>
        // Wait for scClient and scHelper to be ready
        function initSearchPanel() {
            if (!window.scClient || !window.scHelper) {
                console.log('[Search] Waiting for scClient/scHelper...');
                setTimeout(initSearchPanel, 100);
                return;
            }

            // Create alias #search-input for the search panel
            if (!$('#search-input').length && $('#scg-search-input').length) {
                $('#scg-search-input').attr('id', 'search-input');
            }

            // Override translateByKeyWord to use WebSocket instead of HTTP
            window.translateByKeyWord = async function(event, string) {
                console.log('[custom] translateByKeyWord called with:', string);
                if (!string) {
                    event.stopPropagation();
                    $('.typeahead').val('');
                    $('.tt-dropdown-menu').hide();
                    return;
                }

                console.log('[custom] Step 1: Searching links by content:', string);

                try {
                    // Step 1: Search for links with this content
                    let linkAddrs = await window.scClient.searchLinksByContents([string]);
                    console.log('[custom] Step 1 result:', linkAddrs);
                    let addr = null;

                    if (linkAddrs.length && linkAddrs[0].length) {
                        let linkAddr = linkAddrs[0][0];
                        console.log('[custom] Step 2: Found linkAddr:', linkAddr);
                        
                        // Step 2: Try to find node with this identifier
                        console.log('[custom] Step 2a: Searching by nrel_system_identifier...');
                        addr = await window.scHelper.searchNodeByIdentifier(linkAddr, window.scKeynodes["nrel_system_identifier"]);
                        console.log('[custom] Step 2a result:', addr);
                        
                        if (!addr) {
                            console.log('[custom] Step 2b: Searching by nrel_main_idtf...');
                            addr = await window.scHelper.searchNodeByIdentifier(linkAddr, window.scKeynodes["nrel_main_idtf"]);
                            console.log('[custom] Step 2b result:', addr);
                        }
                        if (!addr) {
                            addr = linkAddr;
                            console.log('[custom] Using linkAddr directly');
                        }
                    }

                    if (addr) {
                        console.log('[custom] Found addr:', addr.value);
                        // Instead of HTTP command, load via WebSocket directly
                        console.log('[custom] Dispatching scSearchSelect event with addr:', addr.value, 'identifier:', string);
                        window.dispatchEvent(new CustomEvent('scSearchSelect', { detail: { addr: addr.value, identifier: string } }));
                        console.log('[custom] Event dispatched');
                    } else {
                        console.warn('[custom] No address found for:', string);
                    }
                } catch (error) {
                    console.error('[custom] Error:', error);
                }

                event.stopPropagation();
                $('.typeahead').val('');
                $('.tt-dropdown-menu').hide();
            };

            // Initialize SearchPanel
            SCWeb.ui.SearchPanel.init().then(function() {
                console.log('[Search] SearchPanel initialized');
            });
        }

        // Start initialization after scClient is ready
        window.addEventListener('scClientReady', function() {
            // Wait a bit more for scHelper to be ready
            setTimeout(initSearchPanel, 500);
        });
    </script>

    <!-- Wait for Monaco to load, then initialize -->
    <script>
        function initScsEditor() {
            if (typeof monaco === 'undefined') {
                console.warn('[App] Monaco not ready, retrying...');
                setTimeout(initScsEditor, 100);
                return;
            }
            
            // Define ScsEditor class for Monaco (compatible with editor-manager.js)
            window.ScsEditor = function ScsEditor(container, value, theme) {
                this._container = container;
                this.editor = monaco.editor.create(container, {
                    language: 'scs',
                    theme: theme || 'scs',
                    automaticLayout: true,
                });
                
                if (value) {
                    this.content = value;
                }
            };
            
            window.ScsEditor.prototype.getValue = function() {
                return this.editor.getValue();
            };
            
            window.ScsEditor.prototype.setValue = function(newValue) {
                this.editor.setValue(newValue);
            };
            
            Object.defineProperty(window.ScsEditor.prototype, 'content', {
                get: function() { return this.editor.getValue(); },
                set: function(v) { this.editor.setValue(v); }
            });
            
            window.ScsEditor.prototype.focus = function() {
                this.editor.focus();
            };
            
            console.log('[App] ScsEditor class defined');
        }
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initScsEditor);
        } else {
            initScsEditor();
        }
        
        // Also try after monacoLoaded event
        window.addEventListener('monacoLoaded', initScsEditor);
    </script>
